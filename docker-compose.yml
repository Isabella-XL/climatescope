services:
  api:
    build: .
    container_name: climatescope-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret}
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:5173